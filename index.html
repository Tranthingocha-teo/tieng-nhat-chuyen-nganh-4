<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-24">

hệ ② 国際（こくさい）: quốc tế ③ 手際（てぎわ）: khéo léo, thành thạo (trong xử lý công việc)"}, {"unit": "U16", "unit_desc": "Unit 16: Chuẩn bị Operation Demo (オペレーションデモ準備)", "no": 4, "kanji": "育", "hanviet": "DỤC", "onyomi": "イク", "kunyomi": "そだつ そだてる *はぐくむ", "meaning": "Nuôi dưỡng", "examples": "① 体育（たいいく）: thể dục, giáo dục thể chất ② 育つ（そだつ）: lớn lên, trưởng thành, phát triển ③ 育成（いくせい）: đào tạo, nuôi dưỡng, bồi dưỡng (kỹ năng, nhân tài…) ④ 教育（きょういく）: giáo dục, dạy dỗ"}, {"unit": "U16", "unit_desc": "Unit 16: Chuẩn bị Operation Demo (オペレーションデモ準備)", "no": 5, "kanji": "替", "hanviet": "THẾ", "onyomi": "タイ", "kunyomi": "かえる かわる", "meaning": "Thay thế, trao đổi", "examples": "① 両替（りょうがえ）: đổi tiền ② 取り替える（とりかえる）: đổi, thay (vật này sang vật khác) ③ 交替（こうたい）: thay phiên, luân phiên"}];

    let activeTab = 'vocab';
    let selectedUnit = 'ALL';
    let searchQuery = '';
    let filteredVocab = [...VOCAB_DATA];
    let filteredKanji = [...KANJI_DATA];
    let fcIndex = 0;

    // Unit lists
    const units = [
      { id: 'ALL', name: 'Tất cả Units' },
      { id: 'U9', name: 'Unit 9: Unit Test' },
      { id: 'U10', name: 'Unit 10: Tiến độ' },
      { id: 'U11', name: 'Unit 11: Trễ hạn' },
      { id: 'U12', name: 'Unit 12: Module' },
      { id: 'U13', name: 'Unit 13: Integration' },
      { id: 'U14', name: 'Unit 14: Debug' },
      { id: 'U15', name: 'Unit 15: System Test' },
      { id: 'U16', name: 'Unit 16: Operation Demo' },
    ];

    function init() {
      renderUnitChips();
      renderVocab();
      renderKanji();
      setupSearch();
      updateFlashcard();
    }

    function renderUnitChips() {
      const container = document.getElementById('unitChipsContainer');
      container.innerHTML = units.map(u => `
        <button onclick="selectUnit('${u.id}')" class="unit-chip px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${
          selectedUnit === u.id 
            ? 'bg-indigo-600 text-white shadow-xs' 
            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
        }">
          ${u.name}
        </button>
      `).join('');
    }

    function selectUnit(uId) {
      selectedUnit = uId;
      renderUnitChips();
      applyFilters();
    }

    function switchTab(tab) {
      activeTab = tab;
      
      const views = {
        vocab: document.getElementById('vocabView'),
        kanji: document.getElementById('kanjiView'),
        flashcard: document.getElementById('flashcardView')
      };
      
      const btns = {
        vocab: document.getElementById('tabBtnVocab'),
        kanji: document.getElementById('tabBtnKanji'),
        flashcard: document.getElementById('tabBtnFlashcard')
      };

      Object.keys(views).forEach(k => {
        if (k === tab) {
          views[k].classList.remove('hidden');
          btns[k].className = 'py-2.5 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-1.5 transition font-bold';
        } else {
          views[k].classList.add('hidden');
          btns[k].className = 'py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-1.5 transition font-semibold';
        }
      });

      if (tab === 'flashcard') {
        fcIndex = 0;
        updateFlashcard();
      }
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearch');

      input.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        if (searchQuery) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        applyFilters();
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        searchQuery = '';
        clearBtn.classList.add('hidden');
        applyFilters();
      });
    }

    function applyFilters() {
      // Filter Vocab
      filteredVocab = VOCAB_DATA.filter(item => {
        const matchUnit = (selectedUnit === 'ALL' || item.unit === selectedUnit);
        if (!matchUnit) return false;
        if (!searchQuery) return true;
        return (
          item.vocab.toLowerCase().includes(searchQuery) ||
          item.yomi.toLowerCase().includes(searchQuery) ||
          item.vie.toLowerCase().includes(searchQuery) ||
          item.eng.toLowerCase().includes(searchQuery)
        );
      });

      // Filter Kanji
      filteredKanji = KANJI_DATA.filter(item => {
        const matchUnit = (selectedUnit === 'ALL' || item.unit === selectedUnit);
        if (!matchUnit) return false;
        if (!searchQuery) return true;
        return (
          item.kanji.toLowerCase().includes(searchQuery) ||
          item.hanviet.toLowerCase().includes(searchQuery) ||
          item.meaning.toLowerCase().includes(searchQuery) ||
          item.examples.toLowerCase().includes(searchQuery)
        );
      });

      document.getElementById('vocabCountBadge').innerText = filteredVocab.length;
      document.getElementById('kanjiCountBadge').innerText = filteredKanji.length;

      renderVocab();
      renderKanji();
      
      fcIndex = 0;
      updateFlashcard();
    }

    function renderVocab() {
      const container = document.getElementById('vocabListContainer');
      const empty = document.getElementById('vocabEmpty');

      if (filteredVocab.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      container.innerHTML = filteredVocab.map((item, idx) => `
        <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs flex items-center justify-between hover:border-indigo-300 transition group">
          <div class="flex-1 pr-3">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="px-1.5 py-0.5 rounded-md bg-indigo-50 text-indigo-700 text-[10px] font-bold">
                ${item.unit}
              </span>
              <span class="text-[10px] font-medium text-slate-400">
                ${item.part_desc}
              </span>
            </div>
            <div class="flex items-baseline gap-2">
              <h3 class="text-base font-bold text-slate-900 jp-font leading-snug">${item.vocab}</h3>
              <span class="text-xs text-indigo-600 jp-font font-medium">${item.yomi}</span>
            </div>
            <p class="text-xs text-slate-700 font-semibold mt-0.5">${item.vie}</p>
            <p class="text-[11px] text-slate-400 italic">${item.eng}</p>
          </div>

          <button onclick="speakJapanese('${item.vocab}')" class="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-indigo-50 text-slate-400 group-hover:text-indigo-600 flex items-center justify-center transition active:scale-90 shrink-0">
            <i class="fa-solid fa-volume-high text-xs"></i>
          </button>
        </div>
      `).join('');
    }

    function renderKanji() {
      const container = document.getElementById('kanjiListContainer');
      const empty = document.getElementById('kanjiEmpty');

      if (filteredKanji.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      container.innerHTML = filteredKanji.map((item) => `
        <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs hover:border-violet-300 transition">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-2">
              <div class="w-12 h-12 rounded-xl bg-violet-50 text-violet-700 flex items-center justify-center text-2xl font-bold jp-font shadow-xs">
                ${item.kanji}
              </div>
              <div>
                <span class="px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[10px] font-bold uppercase">
                  ${item.hanviet}
                </span>
                <p class="text-xs font-bold text-slate-800 mt-1">${item.meaning}</p>
              </div>
            </div>
            <span class="text-[10px] font-bold text-slate-400">${item.unit}</span>
          </div>

          <div class="mt-2.5 pt-2 border-t border-slate-100 text-[11px] space-y-1">
            <div class="flex"><span class="w-14 text-slate-400 font-medium">On:</span> <span class="font-semibold text-slate-700 jp-font">${item.onyomi || '-'}</span></div>
            <div class="flex"><span class="w-14 text-slate-400 font-medium">Kun:</span> <span class="font-semibold text-slate-700 jp-font">${item.kunyomi || '-'}</span></div>
            <div class="text-slate-600 text-[10px] bg-slate-50 p-2 rounded-lg mt-1.5 font-medium leading-relaxed jp-font">
              ${item.examples}
            </div>
          </div>
        </div>
      `).join('');
    }

    // Flashcard functions
    function flipCard() {
      document.getElementById('fcInner').classList.toggle('flipped');
    }

    function updateFlashcard() {
      const inner = document.getElementById('fcInner');
      inner.classList.remove('flipped');

      if (filteredVocab.length === 0) {
        document.getElementById('fcFrontVocab').innerText = 'Không có thẻ';
        document.getElementById('fcFrontYomi').innerText = '';
        document.getElementById('fcBackVie').innerText = 'Hãy chọn Unit khác';
        document.getElementById('fcBackEng').innerText = '';
        document.getElementById('fcBackReading').innerText = '';
        document.getElementById('fcProgress').innerText = '0 / 0';
        return;
      }

      const item = filteredVocab[fcIndex];
      document.getElementById('fcFrontVocab').innerText = item.vocab;
      document.getElementById('fcFrontYomi').innerText = item.yomi;
      document.getElementById('fcBackVie').innerText = item.vie;
      document.getElementById('fcBackEng').innerText = item.eng;
      document.getElementById('fcBackReading').innerText = item.yomi;
      document.getElementById('fcUnitTag').innerText = item.unit + ' • ' + item.part;
      document.getElementById('fcProgress').innerText = `Thẻ ${fcIndex + 1} / ${filteredVocab.length}`;
    }

    function nextCard() {
      if (filteredVocab.length === 0) return;
      fcIndex = (fcIndex + 1) % filteredVocab.length;
      updateFlashcard();
    }

    function prevCard() {
      if (filteredVocab.length === 0) return;
      fcIndex = (fcIndex - 1 + filteredVocab.length) % filteredVocab.length;
      updateFlashcard();
    }

    function shuffleCards() {
      for (let i = filteredVocab.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredVocab[i], filteredVocab[j]] = [filteredVocab[j], filteredVocab[i]];
      }
      fcIndex = 0;
      updateFlashcard();
    }

    // Native Speech Synthesis
    function speakJapanese(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    init();
  </script>
</body>
